# One-off recovery: run 41's .env rewrite dropped DATABASE_URL on the staging
# box (the deploy workflow now preserves box-managed keys, but the value was
# already gone). This restores it WITHOUT printing the secret to logs, then
# restarts the app. Delete this workflow once staging is healthy again.
name: Restore staging env

# push-trigger scoped to this file: workflow_dispatch only registers from the
# default branch, and pushing anything to main would fire a PROD deploy with
# the pre-fix artifact recipe — absolutely not. Touch this file to re-run.
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/restore-env.yml']

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restore DATABASE_URL and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOF'
          set -e
          APP_DIR="$HOME/apps/peterna-staging"
          cd "$APP_DIR"
          if grep -q '^DATABASE_URL=' .env 2>/dev/null; then
            echo "DATABASE_URL already present — nothing to restore"
            exit 0
          fi
          hit=""
          # 1) Box-wide sweep of this user's files for the staging connection
          #    string: pm2 dumps (incl. the .bak pm2 writes on every save),
          #    ecosystem configs, env backups, shell history. Never print the
          #    match itself — only which file held it.
          found_file=$(grep -rls --exclude-dir=node_modules --exclude-dir=.next \
            'peterna_staging' \
            "$HOME/.pm2/dump.pm2" "$HOME/.pm2/dump.pm2.bak" \
            "$HOME/apps" "$HOME/.bash_history" "$HOME"/*.env "$HOME"/*.json 2>/dev/null | head -5 || true)
          echo "files mentioning peterna_staging:"; echo "$found_file"
          for f in $found_file; do
            line=$(grep -oh 'postgres[a-z]*://[^"'"'"' ]*peterna_staging[^"'"'"' \\]*' "$f" 2>/dev/null | head -1 || true)
            if [ -n "$line" ]; then hit="DATABASE_URL=$line"; echo "recovered connection string from: $f"; break; fi
          done
          # 2) Trust/peer auth? If local postgres lets us in without a password,
          #    we can set a fresh one ourselves.
          if [ -z "$hit" ]; then
            if psql "postgresql://peterna_staging@127.0.0.1:5432/peterna_staging" -q -c 'select 1' >/dev/null 2>&1; then
              pw=$(openssl rand -hex 16)
              psql "postgresql://peterna_staging@127.0.0.1:5432/peterna_staging" -q -c "ALTER USER peterna_staging WITH PASSWORD '$pw'"
              hit="DATABASE_URL=postgresql://peterna_staging:$pw@127.0.0.1:5432/peterna_staging?schema=public"
              echo "trust auth worked — set fresh password"
            fi
          fi
          # 3) Passwordless sudo (unlikely — documented for completeness)
          if [ -z "$hit" ] && sudo -n true 2>/dev/null; then
            pw=$(openssl rand -hex 16)
            sudo -u postgres psql -q -c "ALTER USER peterna_staging WITH PASSWORD '$pw'"
            hit="DATABASE_URL=postgresql://peterna_staging:$pw@127.0.0.1:5432/peterna_staging?schema=public"
            echo "reset peterna_staging postgres password via sudo"
          fi
          if [ -z "$hit" ]; then
            echo "FAILED: could not recover DATABASE_URL (no copy found, no trust auth, no sudo)"
            exit 1
          fi
          printf '%s\n' "$hit" >> .env
          export PATH="$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" | tail -n1)/bin:$PATH:/usr/local/bin:/usr/bin"
          pm2 restart peterna-staging
          echo "restored + restarted"
          EOF

      - name: Health check
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://staging.peterna.com/api/build")
          echo "GET /api/build -> $code"
          test "$code" = "200"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
